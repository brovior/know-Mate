# 직접 수정 금지: 개선은 ai-dev-workflow 정본에 하고 init_project.py --update로 동기화한다.
# vendored from ai-dev-workflow — templates/gpt-design-review.yml
# 직접 수정 금지: 개선은 ai-dev-workflow 정본에 하고 init_project.py --update로 동기화한다.
# 채널 B — GPT 독립 설계 리뷰 (옵트인: PR에 '/gpt-review' 코멘트를 달 때만 실행)
#
# ⚠️ 설계 PR을 여는 것만으로는 리뷰가 돌지 않는다. PR에 **`/gpt-review` 코멘트**가 달릴 때만
#    GitHub 러너에서 scripts/ai_workflow/gpt_review.py 를 실행해 리뷰를
#    ① PR 코멘트로 게시하고 ② docs/ai-workflow/reviews/ 에 커밋한다.
#    → 명시적으로 리뷰를 요청했을 때만 코멘트를 단다. 재리뷰=코멘트 한 번 더.
#
# 가드:
#  - 코멘트에 '/gpt-review'가 없으면 실행 안 함 / PR이 아닌 이슈 코멘트면 실행 안 함
#  - repo Secret OPENAI_API_KEY 미등록 → 조용히 skip (무해)
#  - fork PR(isCrossRepository) → skip (secret 미노출·신뢰 경계, ADR-0003)
#  - github-actions[bot]의 코멘트로는 재실행 안 함(자기 트리거 방지)
# 정본: ai-dev-workflow (vendored — 직접 수정 금지, init_project.py --update로 동기화)

name: GPT Design Review

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: gpt-design-review-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  review:
    # PR 코멘트 + '/gpt-review' 포함 + 봇 자기 트리거 방지
    if: >-
      github.event.issue.pull_request &&
      github.actor != 'github-actions[bot]' &&
      contains(github.event.comment.body, '/gpt-review')
    runs-on: ubuntu-latest
    steps:
      - name: Secret 게이트 (미등록이면 무해 skip)
        id: gate
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            echo "::notice::OPENAI_API_KEY secret 미등록 — GPT 리뷰를 건너뜀"
          else
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          fi

      - name: PR 메타 조회 (fork 차단·base/head SHA)
        id: pr
        if: steps.gate.outputs.has_key == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DATA=$(gh pr view "${{ github.event.issue.number }}" --repo "${{ github.repository }}" \
            --json headRefName,headRefOid,baseRefOid,isCrossRepository)
          if [ "$(echo "$DATA" | jq -r .isCrossRepository)" = "true" ]; then
            echo "fork=true" >> "$GITHUB_OUTPUT"
            echo "::notice::fork PR — GPT 리뷰 건너뜀"
          else
            echo "fork=false" >> "$GITHUB_OUTPUT"
            echo "head_ref=$(echo "$DATA" | jq -r .headRefName)" >> "$GITHUB_OUTPUT"
            echo "head_sha=$(echo "$DATA" | jq -r .headRefOid)" >> "$GITHUB_OUTPUT"
            echo "base_sha=$(echo "$DATA" | jq -r .baseRefOid)" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout (PR head, 전체 이력)
        if: steps.gate.outputs.has_key == 'true' && steps.pr.outputs.fork == 'false'
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.head_ref }}
          fetch-depth: 0

      - name: 변경된 설계 문서 수집
        if: steps.gate.outputs.has_key == 'true' && steps.pr.outputs.fork == 'false'
        id: changed
        env:
          BASE_SHA: ${{ steps.pr.outputs.base_sha }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          FILES=$(git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$HEAD_SHA" \
            -- 'docs/ai-workflow/*.md' 'docs/ai-workflow/adr/*.md' \
            | grep -v -E '^docs/ai-workflow/(reviews|prompts)/' || true)
          if [ -z "$FILES" ]; then
            echo "any=false" >> "$GITHUB_OUTPUT"
            echo "::notice::리뷰 대상 설계 문서 변경 없음 — skip"
          else
            echo "any=true" >> "$GITHUB_OUTPUT"
            echo "files=$(echo "$FILES" | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
            echo "리뷰 대상: $FILES"
          fi

      - name: Python 준비
        if: steps.gate.outputs.has_key == 'true' && steps.changed.outputs.any == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: GPT 리뷰 실행
        if: steps.gate.outputs.has_key == 'true' && steps.changed.outputs.any == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GPT_REVIEW_MODEL: ${{ vars.GPT_REVIEW_MODEL }}
        run: |
          pip install --quiet openai
          # vars.GPT_REVIEW_MODEL 미설정이면 빈 값 → 스크립트 기본값 사용
          [ -z "$GPT_REVIEW_MODEL" ] && unset GPT_REVIEW_MODEL
          # 배경 문서는 docs/ai-workflow/context-manifest.txt(프로젝트 선언)가 자동 동봉 —
          # 여기서 파일명을 하드코딩하지 않는다.
          python scripts/ai_workflow/gpt_review.py ${{ steps.changed.outputs.files }} \
            --channel "B(action)"

      - name: 리뷰를 PR 브랜치에 커밋
        if: steps.gate.outputs.has_key == 'true' && steps.changed.outputs.any == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ai-workflow/reviews/
          if git diff --cached --quiet; then
            echo "커밋할 리뷰 없음"
          else
            git commit -m "review(gpt): 설계 독립 리뷰 자동 게시 (channel B)"
            git push origin "HEAD:${{ steps.pr.outputs.head_ref }}"
          fi

      - name: 리뷰를 PR 코멘트로 게시
        if: steps.gate.outputs.has_key == 'true' && steps.changed.outputs.any == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST=$(ls -t docs/ai-workflow/reviews/REVIEW-*.md | head -1)
          {
            echo "## 🔍 GPT 독립 설계 리뷰 (자동, 채널 B)"
            echo ""
            cat "$LATEST"
            echo ""
            echo "---"
            echo "_자동 생성: GPT Design Review Action (ai-dev-workflow) — 판단·확정 권한은 Chief Architect(Claude)에게 있음._"
          } > /tmp/comment.md
          gh pr comment "${{ github.event.issue.number }}" --body-file /tmp/comment.md
