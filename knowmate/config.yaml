log_level: INFO   # DEBUG | INFO | WARNING | ERROR

extractor: auto
embedding:
  mode: api                # 반드시 api. local은 폐쇄망에서 모델 다운로드 불가로 무한 대기 발생 (CLAUDE.md 환경 절 참조)
  local_model: BAAI/bge-m3
  base_url: http://10.x.x.x   # ← 빌드 전 실제 사내 임베딩 서버 IP로 교체
  host_header: embed.internal
  api_key: ""              # 비워두면 EMBED_API_KEY 환경변수 → 더미값(dummy) 순으로 사용
  # 모델·차원은 rag/embedding.py 의 상수(MODEL_DIMS)로 고정. 변경 시 전체 재인덱싱 필요.
  batch_size: 32
chunking:
  chunk_size: 400
  overlap: 80
  max_file_size_mb: 30        # 1단: 이 크기 초과 파일은 파싱 전에 제외
  xlsx_max_rows_per_sheet: 2000  # 2단: xlsx 시트당 행 수 초과 시 메타 청크 1개로 대체
  max_chunks_per_file: 500    # 3단: 모든 형식 공통 최대 청크 수 (최후 안전망)
  xlsx_block_rows: 1000       # COM(구형 xls·DRM) 경로에서 Excel 셀을 한 번에 읽을 행 수.
                              # 셀 단위로 읽으면 셀마다 COM 왕복이 일어나 대형 시트가
                              # 매우 느리다 — 범위 단위로 묶어 왕복을 블록당 1회로 줄인다.
                              # 크게 잡을수록 왕복이 줄지만 순간 메모리가 늘어난다.
                              # 비우거나 잘못된 값이면 1000으로 폴백.
search:
  top_k_max: 10
  score_threshold: 0.3
  rerank_enabled: false
collector:
  watch_folders: []        # 배포 기본값은 비움. 앱의 [폴더 관리]에서 사용자별로 지정
  exclude_files: []        # 5차: [확인 필요한 문서] 화면에서 사용자가 인덱싱 제외한 절대경로 목록
  idle_enabled: true       # 유휴 시간 경과 시 자동 인덱싱 여부
  idle_seconds: 60
  drm_idle_threshold_sec: 480  # 이 시간(초) 이상 유휴면 DRM/SSO 세션 만료로 보고
                                # DRM 의심 문서(구형 바이너리·오라벨 OOXML)는 해당
                                # 사이클에서 건너뜀(다음 유효 사이클에 자동 재시도)
  # COM 추출 행오버 방지 워치독 — Office Open/셀 순회가 멈추면 파일 크기 비례
  # 시간(base + per_mb×MB, cap 상한) 뒤 해당 Office 프로세스를 강제 종료해 블로킹을
  # 풀고 그 파일만 실패 처리한다(사이클은 계속). base를 0 이하로 두면 비활성.
  com_timeout_base_sec: 60     # 크기 무관 기본 여유(Open + 오버헤드)
  com_timeout_per_mb_sec: 20   # MB당 가산(셀 단위 COM 왕복이 느린 대형 파일 보호)
  com_timeout_max_sec: 600     # 상한(안전망)
  com_restart_every_n_files: 30  # COM 파일 이 건수마다 Office를 선제 재기동(핸들/메모리 누수 완화). 0이면 비활성.
  # Quit() 요청 후 Office가 실제로 종료되기를 기다리는 유예 시간. Quit()은 종료를
  # 요청만 하고 즉시 반환하므로, 유예 없이 바로 강제종료하면 스스로 정리 중인
  # Office까지 매번 강제종료로 오판해 세이프모드 유발 표식이 반복 생성된다.
  # 0으로 두면 유예 없이 즉시 강제종료(이전 동작, 비상 스위치).
  com_quit_grace_sec: 5
  # purge(제거된 폴더 청크 정리) 스킵/강제 reconciliation — 유휴 방치 중 매 사이클
  # LanceDB 전체를 로드하지 않도록, 구성 불변+처리 0건이면 스킵하되 아래 주기로
  # 강제 재확인한다. 일시적 실패는 이 간격만큼 재시도를 늦춘다.
  purge_force_reconcile_sec: 86400  # 24시간 — 스킵이 계속돼도 이 주기로 강제 1회 실행
  purge_backoff_sec: 1800           # 30분 — purge 일시 실패 후 재시도 대기
  # 파일별 실패 백오프(4차) — index_failure.json에 기록된 실패 유형·연속 횟수에
  # 따라 문제 파일을 매 사이클(유휴 idle_seconds마다) 다시 열지 않고 재시도 시점을
  # 미룬다. 영구 무시가 아니라 시점 조정뿐이며, 파일이 변경되거나 수동 재인덱싱하면
  # 즉시 다시 시도된다. enabled: false로 끄면 이 기능 도입 전(매 사이클 재시도)과
  # 동일하게 동작한다(비상 스위치).
  failure_backoff:
    enabled: true
    temporary_busy_sec: 300          # 다른 사용자 사용중: 항상 5분 base(+지터로 5~10분).
                                      # 반복 승격(아래 escalation_*)과 무관하게 고정 — 사용자가
                                      # 파일을 닫으면 곧 해소되므로 며칠씩 대기시키면 안 됨(6a)
    timeout_ladder_sec: [1800, 21600]  # Open/읽기 오류·시간초과: 1회 30분→2회 6시간.
                                        # 3회째부터는 escalation_action_at에 걸려
                                        # needs_user_action_max_sec(아래, 기본 7일)로 승격
    unknown_ladder_sec: [1800, 21600]  # 원인 불명 오류: 위와 동일 사다리(실측 후 별도 조정 가능)
    file_changed_sec: 0              # 처리 도중 파일 변경: 항상 다음 사이클 즉시 재시도(고정)
    needs_user_action_max_sec: 604800  # 손상/암호 등 사용자 조치 필요: 항상 이 값(고정).
                                        # 파일 변경·수동 요청 시 즉시 재시도, 그 외엔 7일마다
                                        # 안전하게 재확인(영구 무시 방지 — 세이프모드 루프 재발 방지).
                                        # timeout/unknown 사다리가 3회째에 승격될 때도 이 값을 재사용
    escalation_repeat_at: 2   # 이 회차부터 화면에 "반복 중" 표시(대기 시간은 안 바뀜)
    escalation_action_at: 3   # 이 회차부터 화면에 "조치 필요" 표시 + 대기가 위 7일로 승격
                               # (TEMPORARY_BUSY·FILE_CHANGED·NEEDS_USER_ACTION은 표시만
                               # 승격되고 대기는 위 고정값 유지 — 6a, 3차 리뷰 M-2)
cleanup:
  dry_run: true
  max_delete_ratio: 0.3
llm:
  mode: api                # 사내 LLM 서버 직접 호출 (fake|claude|openrouter|api)
  model: qwen3-27b
  api_key: ""              # 비우면 더미값(dummy). 사내 서버가 키 요구 시 채움
  base_url: http://10.x.x.x   # ← 빌드 전 실제 사내 LLM 서버 IP로 교체
  host_header: llm.internal
  max_context_tokens: 4096
mail:
  enabled: true            # watch_folders 내 메일 파일 자동 인덱싱 (false로 끄기)
  extensions:              # 인덱싱할 메일 확장자 (.mysingle=Knox, .eml=표준 이메일)
  - .mysingle
  - .eml
  max_mails_per_scan: 500  # 스캔당 처리 상한 (최신 mtime 순)
  batch_commit_every: 50   # state 중간 저장 주기
ui:
  close_action: tray       # 닫기(X) 버튼 동작: tray(트레이로 숨김) | quit(앱 종료)
